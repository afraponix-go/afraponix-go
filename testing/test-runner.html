<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquaponics App - Integration Tests</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0051b1 0%, #7BAAEE 100%);
            color: white;
            min-height: 100vh;
        }
        
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 30px;
            color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            color: #0051b1;
            margin-bottom: 30px;
        }
        
        .status-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #0051b1;
        }
        
        .status-card.success { border-left-color: #80FB7B; }
        .status-card.error { border-left-color: #ff4444; }
        .status-card.warning { border-left-color: #f59e0b; }
        
        .status-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .test-results {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .test-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .test-item:last-child {
            border-bottom: none;
        }
        
        .test-icon {
            font-size: 1.2em;
            margin-right: 10px;
            min-width: 30px;
        }
        
        .test-name {
            font-weight: bold;
            margin-right: 15px;
            min-width: 200px;
        }
        
        .test-details {
            color: #666;
            flex: 1;
        }
        
        .run-tests-btn {
            background: #0051b1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        
        .run-tests-btn:hover {
            background: #003a80;
        }
        
        .run-tests-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-top: 2px solid #0051b1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-list {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .error-item {
            color: #c53030;
            margin-bottom: 5px;
        }
        
        .console-output {
            background: #1a1a1a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Aquaponics App Integration Tests</h1>
        
        <button id="run-tests" class="run-tests-btn" onclick="runTests()">
            🚀 Run Integration Tests
        </button>
        
        <div class="status-panel">
            <div class="status-card">
                <div class="status-number" id="total-tests">0</div>
                <div>Total Tests</div>
            </div>
            <div class="status-card success">
                <div class="status-number" id="passed-tests">0</div>
                <div>Passed</div>
            </div>
            <div class="status-card error">
                <div class="status-number" id="failed-tests">0</div>
                <div>Failed</div>
            </div>
            <div class="status-card warning">
                <div class="status-number" id="warning-tests">0</div>
                <div>Warnings</div>
            </div>
        </div>
        
        <div id="test-status" class="loading" style="display: none;">
            Running tests, please wait...
        </div>
        
        <div id="test-results" class="test-results" style="display: none;">
            <h3>📋 Test Results</h3>
            <div id="results-container"></div>
        </div>
        
        <div id="critical-errors" style="display: none;">
            <h3>🚨 Critical Errors</h3>
            <div class="error-list" id="errors-container"></div>
        </div>
        
        <div id="console-output" class="console-output" style="display: none;">
            <h3 style="color: #00ff00; margin-top: 0;">💻 Console Output</h3>
            <div id="console-content"></div>
        </div>
    </div>

    <!-- Load the main app first -->
    <script type="module" src="../script.js"></script>
    
    <!-- Load integration tests -->
    <script src="integration-test.js"></script>
    
    <script>
        let testRunning = false;
        let consoleOutput = '';
        
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function captureConsole(level, args) {
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
            consoleOutput += `[${level.toUpperCase()}] ${message}\n`;
            
            const consoleContent = document.getElementById('console-content');
            if (consoleContent) {
                consoleContent.textContent = consoleOutput;
                consoleContent.scrollTop = consoleContent.scrollHeight;
            }
        }
        
        console.log = (...args) => {
            originalLog.apply(console, args);
            captureConsole('log', args);
        };
        
        console.error = (...args) => {
            originalError.apply(console, args);
            captureConsole('error', args);
        };
        
        console.warn = (...args) => {
            originalWarn.apply(console, args);
            captureConsole('warn', args);
        };
        
        async function runTests() {
            if (testRunning) return;
            
            testRunning = true;
            const runButton = document.getElementById('run-tests');
            runButton.disabled = true;
            runButton.textContent = '🔄 Running Tests...';
            
            // Reset outputs
            consoleOutput = '';
            document.getElementById('console-content').textContent = '';
            
            // Show loading
            document.getElementById('test-status').style.display = 'block';
            document.getElementById('test-results').style.display = 'none';
            document.getElementById('critical-errors').style.display = 'none';
            document.getElementById('console-output').style.display = 'block';
            
            try {
                // Wait for integration tests to be available
                let attempts = 0;
                while (!window.runIntegrationTests && attempts < 50) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }
                
                if (!window.runIntegrationTests) {
                    throw new Error('Integration tests not loaded');
                }
                
                // Run the tests
                const results = await window.runIntegrationTests();
                
                // Update status
                document.getElementById('total-tests').textContent = results.total;
                document.getElementById('passed-tests').textContent = results.passed;
                document.getElementById('failed-tests').textContent = results.failed;
                document.getElementById('warning-tests').textContent = results.warnings;
                
                // Show results
                document.getElementById('test-status').style.display = 'none';
                document.getElementById('test-results').style.display = 'block';
                
                // Show critical errors if any
                if (results.criticalErrors.length > 0) {
                    document.getElementById('critical-errors').style.display = 'block';
                    const errorsContainer = document.getElementById('errors-container');
                    errorsContainer.innerHTML = results.criticalErrors
                        .map(error => `<div class="error-item">• ${error}</div>`)
                        .join('');
                }
                
                // Update button
                runButton.textContent = results.success ? '✅ Tests Passed' : '❌ Tests Failed';
                runButton.style.background = results.success ? '#80FB7B' : '#ff4444';
                
            } catch (error) {
                console.error('Test execution failed:', error);
                document.getElementById('test-status').innerHTML = `❌ Test execution failed: ${error.message}`;
                runButton.textContent = '❌ Test Failed';
                runButton.style.background = '#ff4444';
            } finally {
                runButton.disabled = false;
                testRunning = false;
            }
        }
        
        // Auto-run tests after a delay
        setTimeout(() => {
            console.log('Auto-running tests in 3 seconds...');
            setTimeout(runTests, 3000);
        }, 1000);
    </script>
</body>
</html>
